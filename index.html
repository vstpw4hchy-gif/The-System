<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --bg-deep: #01030a;
    --panel: #0a1224;
    --panel-2: #0d1830;
    --line: #1c3a5e;
    --line-bright: #3ddcff;
    --cyan: #4fd8ff;
    --cyan-dim: #1e4a63;
    --purple: #8b6bff;
    --text: #d9e8f5;
    --text-dim: #5f7d96;
    --red: #ff3b5c;
    --red-dim: #4a1420;
    --green: #3dffb0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(ellipse 700px 400px at 50% -5%, rgba(79,216,255,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(79,216,255,0.025) 0px, rgba(79,216,255,0.025) 1px, transparent 1px, transparent 3px);
    background-attachment: fixed;
  }
  body.armed {
    background-image:
      radial-gradient(ellipse 700px 400px at 50% -5%, rgba(255,59,92,0.14), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,59,92,0.03) 0px, rgba(255,59,92,0.03) 1px, transparent 1px, transparent 3px);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 26px 18px 60px;
  }

  /* --- HUD panel primitive: angular corners + glow --- */
  .panel {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  }
